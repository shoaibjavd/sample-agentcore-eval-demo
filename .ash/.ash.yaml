# Automated Security Helper (ASH) configuration
#
# Two mechanisms are used, and they are not interchangeable:
#   - global_settings.ignore_paths  — files ASH should not scan at all (build output,
#     run artifacts). Prevents noise rather than acknowledging it.
#   - global_settings.suppressions  — reviewed false positives in files we DO scan.
#     Each entry records why the finding is not a real risk.
#
# Do not add suppressions for unreviewed findings.

global_settings:

  # ---------------------------------------------------------------------------
  # Not source code. Scanning these produced 65 of 68 unsuppressed findings in the
  # 2026-08-19 scan (a 15x noise ratio) and would make a CI gate unusable.
  # ---------------------------------------------------------------------------
  ignore_paths:
    - path: "cdk.out/**"
      reason: "CDK synth output. Regenerated on every synth and contains stale copies of the Dockerfiles from before the non-root fix, so it re-reports findings that no longer exist in source."
    - path: "notebooks/eval_output*.json"
      reason: "OpenTelemetry traces written at run time by notebook 02. Gitignored; same class of high-entropy telemetry identifiers as the fixture below."
    - path: "cdk-nag-report.csv"
      reason: "Generated cdk-nag report artifact, not source. Flagged strings are CDK construct paths and logical IDs."
    - path: ".venv/**"
      reason: "Local virtualenv; third-party code, not this project's source."

  # ---------------------------------------------------------------------------
  # Reviewed false positives.
  # ---------------------------------------------------------------------------
  suppressions:
    # fixtures/sample_traces.json is pre-collected OpenTelemetry span data used by
    # scripts/evaluate_stored_traces.py for deterministic offline evaluation. Live
    # credential material has been removed from it; what remains is telemetry.
    - rule_id: SECRET-HEX-HIGH-ENTROPY-STRING
      path: fixtures/sample_traces.json
      reason: "OTel traceId (32-hex) / spanId (16-hex) correlation identifiers, not credentials"

    - rule_id: SECRET-BASE64-HIGH-ENTROPY-STRING
      path: fixtures/sample_traces.json
      reason: "AgentCore runtime resource-name suffix in aws.log.group.names, not a credential"

    # Container base images are pinned by digest for supply-chain integrity (TS011/TS012).
    # A 64-hex sha256 digest is indistinguishable from a secret to an entropy heuristic;
    # removing the pin to silence the scanner would be a regression.
    - rule_id: SECRET-HEX-HIGH-ENTROPY-STRING
      path: agent/Dockerfile
      reason: "Base image sha256 digest pin, not a credential"

    - rule_id: SECRET-HEX-HIGH-ENTROPY-STRING
      path: mcp-server/Dockerfile
      reason: "Base image sha256 digest pin, not a credential"

    # bandit matches the dict key "token" and reports the literal None as a masked
    # credential. This is an empty in-memory cache initialiser; no secret exists.
    - rule_id: B105
      path: agent/src/assistant_agent.py
      reason: "Empty token cache initialiser (_m2m_token_cache = {'token': None}); no hardcoded credential"
