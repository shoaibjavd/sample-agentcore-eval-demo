# AgentCore Evaluation Pipeline
# Deploys combined stack (assistant + MCP server), invokes agent, runs evaluations, gates the PR.
#
# Required GitHub Secrets:
#   AWS_ROLE_ARN          - IAM role for GitHub OIDC

name: AgentCore Evaluation

on:
  pull_request:
    branches: [main]
    paths:
      - "agent/**"
      - "mcp-server/**"
      - "infrastructure/**"
      - "scripts/**"
      - ".github/workflows/agentcore-eval.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: ap-southeast-2

jobs:
  # Static security scanning. Reports only for now: `continue-on-error: true`
  # means a finding will not block the PR. Triage the current findings, then remove that
  # line to turn this into a real gate.
  security-scan:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install scanners
        run: pip install --quiet bandit==1.8.6 checkov==3.2.499 detect-secrets==1.5.0

      - name: Bandit (Python SAST)
        run: bandit -r agent/src mcp-server scripts -ll

      - name: Checkov (Dockerfiles + IaC)
        run: checkov -d . --framework dockerfile cloudformation --quiet --compact

      - name: detect-secrets
        run: detect-secrets scan --exclude-files '\.venv|cdk\.out|package-lock\.json'

      # Dependencies are pinned to exact versions for supply-chain integrity, which also
      # means a pinned version keeps whatever vulnerabilities it shipped with until it is
      # deliberately bumped. Pins therefore need auditing on every run, not once.
      # Installs each package so transitive dependencies are covered.
      - name: pip-audit (dependency vulnerabilities)
        run: |
          # set -eu so a failed venv/install aborts the step: silently skipping the audit
          # would look like a pass. The audit call itself uses || so that a real finding is
          # recorded for every package rather than stopping at the first one.
          set -eu
          status=0
          for pkg in agent mcp-server; do
            echo "::group::pip-audit — $pkg"
            python -m venv "/tmp/audit-$pkg"
            "/tmp/audit-$pkg/bin/pip" install --quiet --upgrade pip
            "/tmp/audit-$pkg/bin/pip" install --quiet "./$pkg" pip-audit==2.10.1
            # The local package itself is not on PyPI and is reported as skipped; that is
            # expected and does not indicate a missed dependency.
            "/tmp/audit-$pkg/bin/pip-audit" --progress-spinner off || status=1
            echo "::endgroup::"
          done
          exit $status

  evaluate:
    runs-on: ubuntu-latest
    # A same-repo PR can run this workflow under the AWS OIDC role. Naming an
    # environment lets you require reviewer approval before credentials are issued —
    # configure "Required reviewers" on the `dev` environment in repo settings, otherwise
    # this is a label only. Also scope the role's trust policy to this repo and to
    # `pull_request` refs so a fork or another repo cannot assume it.
    environment: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      # --- Deploy infrastructure ---
      - name: Install CDK dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install .

      - name: Set up QEMU for arm64 Docker builds
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: CDK deploy
        run: |
          source .venv/bin/activate
          npx cdk deploy --require-approval never --outputs-file outputs.json

      - name: Extract CDK outputs
        id: cdk
        run: |
          STACK="AgentCoreCICDStack-dev"
          echo "agent_arn=$(jq -r ".[\"$STACK\"].AgentRuntimeArn" outputs.json)" >> "$GITHUB_OUTPUT"
          echo "agent_id=$(jq -r ".[\"$STACK\"].AgentRuntimeId" outputs.json)" >> "$GITHUB_OUTPUT"
          echo "mcp_id=$(jq -r ".[\"$STACK\"].MCPRuntimeId" outputs.json)" >> "$GITHUB_OUTPUT"
          echo "token_endpoint=$(jq -r ".[\"$STACK\"].TokenEndpoint" outputs.json)" >> "$GITHUB_OUTPUT"
          echo "m2m_client_id=$(jq -r ".[\"$STACK\"].M2MClientId" outputs.json)" >> "$GITHUB_OUTPUT"
          echo "pool_id=$(jq -r ".[\"$STACK\"].SharedUserPoolId" outputs.json)" >> "$GITHUB_OUTPUT"

      # --- Wait for runtimes ---
      - name: Wait for runtimes READY
        run: |
          pip install boto3
          python3 -c "
          import boto3, time, sys
          client = boto3.client('bedrock-agentcore-control', region_name='${{ env.AWS_REGION }}')
          for name, rid in [('MCP', '${{ steps.cdk.outputs.mcp_id }}'), ('Agent', '${{ steps.cdk.outputs.agent_id }}')]:
              for _ in range(60):
                  s = client.get_agent_runtime(agentRuntimeId=rid)['status']
                  print(f'{name} Status: {s}')
                  if s == 'READY': break
                  if 'FAILED' in s: sys.exit(1)
                  time.sleep(10)
              else:
                  sys.exit(1)
          print('Warming up MCP server...')
          import urllib.parse, json, subprocess
          # Read client credentials from Secrets Manager rather than interpolating the
          # secret into a command line, where it would appear in the process list and
          # risk landing in logs.
          sm = boto3.client('secretsmanager', region_name='${{ env.AWS_REGION }}')
          creds = json.loads(sm.get_secret_value(SecretId='agentcore/dev/m2m-client')['SecretString'])
          token_resp = subprocess.run([
              'curl', '-s', '-X', 'POST', '${{ steps.cdk.outputs.token_endpoint }}',
              '-H', 'Content-Type: application/x-www-form-urlencoded',
              '--data-urlencode', 'grant_type=client_credentials',
              '--data-urlencode', f"client_id={creds['client_id']}",
              '--data-urlencode', f"client_secret={creds['client_secret']}",
              '--data-urlencode', 'scope=mcp/invoke',
          ], capture_output=True, text=True)
          token = json.loads(token_resp.stdout)['access_token']
          mcp_arn = 'arn:aws:bedrock-agentcore:${{ env.AWS_REGION }}:' + boto3.client('sts').get_caller_identity()['Account'] + ':runtime/${{ steps.cdk.outputs.mcp_id }}'
          encoded_arn = urllib.parse.quote(mcp_arn, safe='')
          url = f'https://bedrock-agentcore.${{ env.AWS_REGION }}.amazonaws.com/runtimes/{encoded_arn}/invocations?qualifier=DEFAULT'
          for attempt in range(10):
              resp = subprocess.run([
                  'curl', '-s', '-o', '/dev/null', '-w', '%{http_code}',
                  '-X', 'POST', url,
                  '-H', f'Authorization: Bearer {token}',
                  '-H', 'Content-Type: application/json',
                  '-d', '{\"jsonrpc\":\"2.0\",\"method\":\"initialize\",\"id\":1}',
              ], capture_output=True, text=True)
              code = resp.stdout.strip()
              print(f'MCP warmup attempt {attempt+1}: HTTP {code}')
              if code == '200':
                  break
              time.sleep(15)
          print('MCP server warm, proceeding...')
          "

      # --- Run evaluation ---
      - name: Install eval dependencies
        run: pip install boto3 requests bedrock-agentcore-starter-toolkit

      - name: Run evaluation
        working-directory: scripts
        run: |
          mkdir -p evals_results
          python3 agentcore_eval.py
        env:
          AGENT_RUNTIME_ARN: ${{ steps.cdk.outputs.agent_arn }}
          AGENT_RUNTIME_ID: ${{ steps.cdk.outputs.agent_id }}
          TOKEN_ENDPOINT: ${{ steps.cdk.outputs.token_endpoint }}
          # The script reads client_id/client_secret straight from Secrets Manager, so the
          # secret value never enters a step output, env file, or log.
          M2M_SECRET_ID: agentcore/dev/m2m-client
          # mcp/invoke is required by the MCP AuthMiddleware for M2M tokens
          # (see mcp-server/src/auth/middleware.py); agentcore/invoke authorizes
          # the agent runtime invocation. Both are granted to the M2M client.
          OAUTH_SCOPE: "mcp/invoke mcp/finance mcp/hr agentcore/invoke"
          EVAL_THRESHOLD: "0.8"

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eval-results
          path: scripts/evals_results/ci_output.json

      - name: Post evaluation summary to PR
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            let body = '## 🤖 AgentCore Evaluation Results\n\n';
            try {
              if (!fs.existsSync('scripts/evals_results/ci_output.json')) {
                body += '⚠️ No evaluation results generated. Check workflow logs.';
              } else {
                const raw = JSON.parse(fs.readFileSync('scripts/evals_results/ci_output.json', 'utf8'));
                const threshold = 0.8;
                body += '| Evaluator | Score | Status |\n|-----------|-------|--------|\n';
                let allPassed = true;
                const results = raw.results || [];
                const scores = {};
                for (const r of results) {
                  if (r.value != null && (!scores[r.evaluator_name] || r.value > scores[r.evaluator_name])) {
                    scores[r.evaluator_name] = r.value;
                  }
                }
                for (const [name, score] of Object.entries(scores)) {
                  const passed = score >= threshold;
                  if (!passed) allPassed = false;
                  body += `| ${name} | ${score.toFixed(2)} | ${passed ? '✅ Pass' : '❌ Fail'} |\n`;
                }
                body += `\n**Threshold:** ${threshold}\n`;
                body += allPassed ? '\n✅ **Quality gate passed.**' : '\n❌ **Quality gate failed.**';
              }
            } catch (e) {
              body += '⚠️ Could not parse results: ' + e.message;
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            });

      # --- Teardown (disabled to keep stack alive for manual testing) ---
      # - name: CDK destroy
      #   if: always()
      #   run: |
      #     source .venv/bin/activate
      #     npx cdk destroy --force
